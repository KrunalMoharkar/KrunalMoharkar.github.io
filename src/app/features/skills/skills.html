
<section id="skills" class="bg-section px-6 py-24">

  <div class="mx-auto max-w-6xl">

    <div class="mb-12 text-center">
      <p class="mb-3 text-sm tracking-widest text-accent-text">
        02 / TECHNICAL EXPERTISE
      </p>

      <h2 class="text-3xl font-bold md:text-4xl">
        My Tech Stack
      </h2>

      <p class="mt-4 text-muted">
        Technologies and tools I work with.
      </p>
    </div>

    <div class="grid gap-6 md:grid-cols-2">

      @for (category of skillCategories(); track category.title) {

        <div
          class="interactive-card rounded-2xl border border-line
                 bg-card p-7
                 transition-all duration-300
                  ">

          <h3 class="mb-6 text-xl font-semibold text-ink">
            {{ category.title }}
          </h3>

          <div class="flex flex-wrap gap-3">

            @for (skill of category.skills; track skill) {
              <span
                class="skill-chip rounded-lg border border-line
                       bg-surface px-4 py-2
                       text-sm text-muted
                       hover:border-accent
                       hover:text-accent-text">
                {{ skill }}
              </span>
            }

          </div>
        </div>

      }

    </div>
  </div>
</section>
